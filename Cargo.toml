[package]
name = "scrubdaddy"
version = "0.1.0-beta.4"
edition = "2021"
description = "Drag-and-drop PDF name scrubber for Windows"
license = "MIT"

[dependencies]
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
png = "0.18"
flate2 = "1.1"
anyhow = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
jpeg-decoder = { version = "0.3", default-features = false }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Globalization",
  "Storage_Streams",
  "Security_Cryptography",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
